<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online Shop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Online Shop</h1>
  <nav id="nav" hidden>
    <button class="nav" data-view="shop">Shop</button>
    <button class="nav" data-view="orders">My orders</button>
    <span id="who"></span>
    <button id="logout" class="ghost">Log out</button>
  </nav>
</header>
<div id="msg" role="status"></div>

<section id="view-auth" class="card narrow" hidden>
  <div class="tabs">
    <button id="tab-login" class="tab active">Log in</button>
    <button id="tab-signup" class="tab">Sign up</button>
  </div>
  <form id="login-form">
    <input id="login-user" placeholder="Username" autocomplete="username" required>
    <input id="login-pass" type="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
  </form>
  <form id="signup-form" hidden>
    <input id="su-user" placeholder="Username (3-20 letters/numbers/_)" autocomplete="username" required>
    <input id="su-email" type="email" placeholder="Email" autocomplete="email" required>
    <input id="su-pass" type="password" placeholder="Password (min 8 characters)" autocomplete="new-password" required>
    <input id="su-pass2" type="password" placeholder="Confirm password" autocomplete="new-password" required>
    <button type="submit">Create account</button>
  </form>
</section>

<main id="view-shop" class="layout" hidden>
  <section class="card">
    <h2>Products</h2>
    <input id="search" type="search" placeholder="Search products...">
    <div id="products"></div>
  </section>
  <aside class="card">
    <h2>Your cart</h2>
    <div id="cart"></div>
    <div class="actions">
      <button id="btn-checkout">Checkout</button>
      <button id="btn-clear" class="ghost">Clear</button>
    </div>
    <form id="pay-form" hidden>
      <h3>Payment</h3>
      <label><input type="radio" name="method" value="CARD" checked> Card</label>
      <label><input type="radio" name="method" value="CASH_ON_DELIVERY"> Cash on delivery</label>
      <div id="card-fields">
        <input id="card" inputmode="numeric" autocomplete="off" placeholder="Card number">
        <div class="two">
          <input id="exp" placeholder="MM/YY" maxlength="5" autocomplete="off">
          <input id="cvv" inputmode="numeric" maxlength="4" placeholder="CVV" autocomplete="off">
        </div>
      </div>
      <p class="meta">Demo only, no real payment is taken. Test card: 4242 4242 4242 4242, any future expiry, any 3-digit CVV.</p>
      <button type="submit">Pay now</button>
    </form>
  </aside>
</main>

<section id="view-orders" class="card wide" hidden>
  <h2>My orders</h2>
  <div id="orders"></div>
</section>

<script src="app.js"></script>
</body>
</html>
